<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sinh viên</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h2>Quản lý điểm sinh viên</h2>
    <label>Họ tên:</label>
    <input type="text" id="name" placeholder="Nhập họ tên sinh viên">
    <label>Điểm:</label>
    <input type="number" id="score" min="0" max="10" step="0.1" placeholder="0-10">
    <button id="addBtn">Thêm</button>
    <input type="text" id="search" placeholder="Tìm kiếm sinh viên">
    <select id="filter">
        <option value="all">Tất cả</option>
        <option value="Giỏi">Giỏi</option>
        <option value="Khá">Khá</option>
        <option value="Trung bình">Trung bình</option>
        <option value="Yếu">Yếu</option>
    </select>
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="scoreHeader">Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
    <div id="stats">
        Tổng SV: 0 | Điểm trung bình: 0
    </div>
    <script src="script.js"></script>
</body>
</html>
