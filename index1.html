<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng kí</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <form id="registrationForm">
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" id="username" name="fullname" required>
            <small class="error" id="usernameError"></small>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" name="email" required>
            <small class="error" id="emailError"></small>
        </div>
        <div class="form-group">
            <label>Số điện thoại:</label>
            <input type="number" id="phone" name="phone" required>
            <small class="error" id="phoneError"></small>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" name="password" required>
            <small class="error" id="passwordError"></small>
        </div>
        <div class="form-group">
            <label>Nhập lại mật khẩu:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <small class="error" id="confirmPasswordError"></small>
        </div>
        <div class="form-group">
            <label>Giới tính:</label>
            <input type="radio" name="gender" value="Nam" required> Nam
            <input type="radio" name="gender" value="Nữ" required> Nữ
            <small class="error" id="genderError"></small> 
        </div>
        <div class="form-group">
            <input type="checkbox" id="terms" name="terms" required> Tôi đồng ý với các điều khoản
            <small class="error" id="termsError"></small>
        </div>
        <button type="submit">Đăng kí</button>
    </form>
    <div id="successMessage"></div>
    <script src="script1.js"></script>
</body>
</html>
